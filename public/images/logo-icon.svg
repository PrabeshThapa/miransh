<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- ================= 1. RED ARCH / CIRCLE (MAROON / CRIMSON) ================= -->
  <!-- Arc starts at top-left (~10 o'clock), sweeps down through bottom, ends at top-right (~2 o'clock) -->
  <path d="M 102 152 A 190 190 0 1 0 398 94" 
        stroke="#9B2838" 
        stroke-width="16" 
        stroke-linecap="butt" 
        fill="none"/>

  <!-- ================= 2. RED SUN (JAPAN HINOMARU / RISING SUN) ================= -->
  <circle cx="172" cy="126" r="28.5" fill="#9B2838"/>

  <!-- ================= 3. BLACK CROSSED STAFFS (X) ================= -->
  <!-- Top-left to bottom-right staff -->
  <line x1="196" y1="52" x2="336" y2="204" stroke="#000000" stroke-width="11" stroke-linecap="butt"/>
  <!-- Bottom-left to top-right staff (holding the flag) -->
  <line x1="238" y1="204" x2="378" y2="48" stroke="#000000" stroke-width="11" stroke-linecap="butt"/>

  <!-- ================= 4. NEPAL FLAG ================= -->
  <!-- Blue Flag Outer Border -->
  <path d="M 282 155 L 380 46 L 418 162 L 362 132 L 370 210 Z" 
        fill="#1E5296"/>
  
  <!-- Crimson Red Flag Inner Field -->
  <path d="M 290 150 L 372 58 L 406 155 L 358 130 L 364 198 Z" 
        fill="#9B2838"/>

  <!-- Upper Pennant: Moon Crescent & Sun Emblem -->
  <g transform="translate(366, 96) rotate(-42) scale(0.95)">
    <!-- Moon Crescent -->
    <path d="M -11.5 0 A 11.5 11.5 0 0 0 11.5 0 A 9 9 0 0 1 -11.5 0 Z" fill="#FFFFFF"/>
    <!-- Moon Sun Rays (Star Points) -->
    <circle cx="0" cy="5" r="4.2" fill="#FFFFFF"/>
    <path d="M -5 4 L 0 -1.5 L 5 4 M -6.5 6.5 L 0 5 L 6.5 6.5 M 0 9.5 L 0 5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Lower Pennant: 12-Ray Sun -->
  <g transform="translate(338, 142) rotate(-42) scale(0.9)">
    <circle cx="0" cy="0" r="7.5" fill="#FFFFFF"/>
    <!-- 12 Sharp Triangular Rays -->
    <path d="M 0 -15 L 2.2 -7.5 L 0 0 L -2.2 -7.5 Z
             M 7.5 -13 L 5.5 -5.5 L 0 0 L 2.2 -7.5 Z
             M 13 -7.5 L 7.5 -2.2 L 0 0 L 5.5 -5.5 Z
             M 15 0 L 7.5 2.2 L 0 0 L 7.5 -2.2 Z
             M 13 7.5 L 5.5 5.5 L 0 0 L 7.5 2.2 Z
             M 7.5 13 L 2.2 7.5 L 0 0 L 5.5 5.5 Z
             M 0 15 L -2.2 7.5 L 0 0 L 2.2 7.5 Z
             M -7.5 13 L -5.5 5.5 L 0 0 L -2.2 7.5 Z
             M -13 7.5 L -7.5 2.2 L 0 0 L -5.5 5.5 Z
             M -15 0 L -7.5 -2.2 L 0 0 L -7.5 2.2 Z
             M -13 -7.5 L -5.5 -5.5 L 0 0 L -7.5 -2.2 Z
             M -7.5 -13 L -2.2 -7.5 L 0 0 L -5.5 -5.5 Z" fill="#FFFFFF"/>
  </g>

  <!-- ================= 5. BLUE HIMALAYAN MOUNTAINS ================= -->
  <!-- Mountain Silhouette (Navy/Royal Blue) -->
  <path d="M 94 336
           C 118 312, 142 290, 168 274
           L 174 294
           C 200 270, 240 215, 287 184
           C 295 188, 305 198, 320 220
           L 326 212
           C 345 224, 372 245, 384 270
           C 405 295, 430 330, 466 384
           C 416 438, 338 468, 250 468
           C 162 468, 84 438, 34 384
           C 52 364, 74 348, 94 336 Z" 
        fill="#1E5296"/>

  <!-- ================= 6. WHITE SNOW CREVICE CUTOUTS ================= -->
  <!-- 1. Central Summit Long Curved Snow Facet -->
  <path d="M 287 186
           C 278 206, 255 240, 235 258
           C 248 245, 260 222, 266 204
           Z" 
        fill="#FFFFFF"/>

  <!-- 2. Central Vertical Snow Gully -->
  <path d="M 287 186
           C 292 210, 296 242, 304 295
           C 298 268, 294 235, 287 215
           Z" 
        fill="#FFFFFF"/>

  <!-- 3. Left Mid-slope Snow Ridge -->
  <path d="M 252 232
           C 230 255, 210 292, 204 304
           C 214 286, 236 258, 256 240
           Z" 
        fill="#FFFFFF"/>

  <!-- 4. Right Secondary Peak Snow Ridge -->
  <path d="M 370 236
           C 362 258, 335 304, 312 328
           C 334 298, 358 264, 368 246
           Z" 
        fill="#FFFFFF"/>

  <!-- 5. Lower-Left Diagonal Snow Couloir -->
  <path d="M 168 274
           C 188 288, 218 312, 216 322
           C 208 314, 185 292, 172 280
           Z" 
        fill="#FFFFFF"/>

  <!-- 6. Lower Left Snow Patch -->
  <path d="M 208 308
           C 220 326, 238 338, 252 334
           C 238 330, 222 318, 212 306
           Z" 
        fill="#FFFFFF"/>

  <!-- 7. Bottom Horizontal Snow Crescent -->
  <path d="M 240 336
           C 255 348, 268 344, 275 338
           C 264 340, 250 335, 242 330
           Z" 
        fill="#FFFFFF"/>

  <!-- 8. Rightmost Base Snow Streak -->
  <path d="M 426 304
           C 440 322, 452 344, 460 360
           C 454 346, 442 328, 430 312
           Z" 
        fill="#FFFFFF"/>
</svg>
