<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Clip path to keep mountain within circle if desired -->
    <clipPath id="circleBounds">
      <circle cx="250" cy="270" r="185"/>
    </clipPath>
  </defs>

  <!-- ================= 1. CIRCLE ARC (RED / CRIMSON) ================= -->
  <!-- Arc starts at top-left (~10 o'clock), goes down around bottom, ends at top-right (~1:30 o'clock) -->
  <path d="M 104 152 A 190 190 0 1 0 398 100" 
        stroke="#962738" 
        stroke-width="17" 
        stroke-linecap="round" 
        fill="none"/>

  <!-- ================= 2. RED SUN (HINOMARU / RISING SUN) ================= -->
  <circle cx="172" cy="126" r="29" fill="#962738"/>

  <!-- ================= 3. BLACK CROSSED LINES (X) ================= -->
  <!-- Left-to-right diagonal staff holding the flag -->
  <line x1="240" y1="202" x2="384" y2="48" stroke="#000000" stroke-width="12" stroke-linecap="square"/>
  <!-- Right-to-left diagonal staff -->
  <line x1="334" y1="202" x2="196" y2="52" stroke="#000000" stroke-width="12" stroke-linecap="square"/>

  <!-- ================= 4. NEPAL FLAG ================= -->
  <!-- Attached to the right-going black staff -->
  <!-- Blue Flag Border -->
  <path d="M 285 154 L 380 48 L 418 160 L 362 130 L 368 210 Z" 
        fill="#1C5393"/>
  
  <!-- Red Flag Inner Field -->
  <path d="M 292 148 L 372 58 L 404 154 L 358 128 L 363 198 Z" 
        fill="#962738"/>

  <!-- Flag Emblems (White) -->
  <!-- Upper Pennant: Moon Crescent & Sun Rays -->
  <g transform="translate(365, 96) rotate(-40) scale(0.95)">
    <!-- Moon Crescent -->
    <path d="M -12 0 A 12 12 0 0 0 12 0 A 9.5 9.5 0 0 1 -12 0 Z" fill="#FFFFFF"/>
    <!-- Moon Rays (8 small star points) -->
    <circle cx="0" cy="5" r="4.5" fill="#FFFFFF"/>
    <path d="M -5 4 L 0 -2 L 5 4 M -7 7 L 0 5 L 7 7 M 0 10 L 0 5" stroke="#FFFFFF" stroke-width="1.8"/>
  </g>

  <!-- Lower Pennant: 12-Ray Sun -->
  <g transform="translate(338, 142) rotate(-40) scale(0.9)">
    <circle cx="0" cy="0" r="7.5" fill="#FFFFFF"/>
    <!-- 12 Sharp Triangular Rays -->
    <path d="M 0 -15 L 2.5 -8 L 0 0 L -2.5 -8 Z
             M 7.5 -13 L 6 -6 L 0 0 L 2.5 -7 Z
             M 13 -7.5 L 8 -2.5 L 0 0 L 6 -6 Z
             M 15 0 L 8 2.5 L 0 0 L 8 -2.5 Z
             M 13 7.5 L 6 6 L 0 0 L 8 2.5 Z
             M 7.5 13 L 2.5 7 L 0 0 L 6 6 Z
             M 0 15 L -2.5 8 L 0 0 L 2.5 8 Z
             M -7.5 13 L -6 6 L 0 0 L -2.5 7 Z
             M -13 7.5 L -8 2.5 L 0 0 L -6 6 Z
             M -15 0 L -8 -2.5 L 0 0 L -8 2.5 Z
             M -13 -7.5 L -6 -6 L 0 0 L -8 -2.5 Z
             M -7.5 -13 L -2.5 -7 L 0 0 L -6 -6 Z" fill="#FFFFFF"/>
  </g>

  <!-- ================= 5. BLUE HIMALAYAN MOUNTAINS ================= -->
  <!-- Mountain Silhouette (Navy Blue) -->
  <path d="M 94 336
           C 115 315, 142 290, 168 274
           L 174 294
           C 200 270, 240 215, 287 184
           C 295 188, 305 198, 320 220
           L 326 212
           C 345 224, 372 245, 384 270
           C 405 295, 430 330, 452 386
           C 410 435, 334 468, 250 468
           C 166 468, 90 435, 48 386
           C 62 365, 78 350, 94 336 Z" 
        fill="#1C5393"/>

  <!-- ================= 6. WHITE SNOW CUTOUTS / CREVICES ================= -->
  <!-- Central Summit Snow Crevices -->
  <path d="M 287 186
           C 278 206, 255 240, 235 258
           C 248 245, 260 222, 266 204
           Z" 
        fill="#FFFFFF"/>

  <path d="M 287 186
           C 292 210, 296 242, 304 295
           C 298 268, 294 235, 287 215
           Z" 
        fill="#FFFFFF"/>

  <!-- Left Side Snow Facet Crevice -->
  <path d="M 252 232
           C 230 255, 210 292, 204 304
           C 214 286, 236 258, 256 240
           Z" 
        fill="#FFFFFF"/>

  <!-- Right Sub-peak Snow Facet -->
  <path d="M 370 236
           C 362 258, 335 304, 312 328
           C 334 298, 358 264, 368 246
           Z" 
        fill="#FFFFFF"/>

  <!-- Lower Left Flowing Snow Accents -->
  <path d="M 208 308
           C 220 326, 238 338, 252 334
           C 238 330, 222 318, 212 306
           Z" 
        fill="#FFFFFF"/>

  <path d="M 240 336
           C 255 348, 268 344, 275 338
           C 264 340, 250 335, 242 330
           Z" 
        fill="#FFFFFF"/>

  <path d="M 168 274
           C 188 288, 218 312, 216 322
           C 208 314, 185 292, 172 280
           Z" 
        fill="#FFFFFF"/>
</svg>
