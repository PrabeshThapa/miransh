<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="mGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59"/>
      <stop offset="100%" stop-color="#1E3E7B"/>
    </linearGradient>
    <linearGradient id="mGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F2C59" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="120" height="120" rx="28" fill="url(#mGrad1)" filter="url(#subtleGlow)"/>

  <!-- Subtle Geometric Bridge Arch Light Ring -->
  <circle cx="60" cy="60" r="44" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Golden Beacon Vertex (Global Sun / Future) -->
  <circle cx="60" cy="34" r="7" fill="url(#goldGrad)"/>

  <!-- Left Upright Pillar (Company Solidity) -->
  <path d="M30 86V42C30 38.6863 32.6863 36 36 36H40C43.3137 36 46 38.6863 46 42V86H30Z" fill="#FFFFFF" fill-opacity="0.95"/>
  
  <!-- Right Upright Pillar -->
  <path d="M74 86V42C74 38.6863 76.6863 36 80 36H84C87.3137 36 90 38.6863 90 42V86H74Z" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Dynamic Center Arch & Chevron Bridge (Connecting Left & Right to the Golden Apex) -->
  <path d="M38 52L60 72L82 52L82 66L60 86L38 66V52Z" fill="url(#mGrad2)"/>
  
  <!-- Sleek Cross-Border Arch Swoosh -->
  <path d="M26 84C44 68 76 68 94 84" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
</svg>
